{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telegram</title>
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

<div class="app" id="app" style="display:none">
  <aside id="sidebar">
    <div class="aside-header">
      <div class="burger" id="burgerBtn"><span></span><span></span><span></span></div>
      <h1>Telegram</h1>
      <div class="aside-icons">
        <span id="searchToggle">🔍</span>
        <span id="newChatBtn">✎</span>
      </div>
    </div>
    <div class="search-bar" id="searchBar" style="display:none">
      <input type="text" id="searchInput" placeholder="Search users or chats..." autocomplete="off">
    </div>
    <div class="chat-tabs">
      <span class="tab active" data-tab="all">All</span>
      <span class="tab" data-tab="private">Private</span>
      <span class="tab" data-tab="group">Groups</span>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="current-user" id="currentUserBar">
      <div class="cu-left">
        <div class="avatar small" id="myAvatar"></div>
        <span id="currentUsername"></span>
      </div>
      <div class="cu-right">
        <span id="settingsBtn" title="Settings">⚙️</span>
        <button onclick="logout()">Logout</button>
      </div>
    </div>
  </aside>

  <main id="mainArea">
    <div class="no-chat" id="noChat">
      <div class="no-chat-icon">💬</div>
      <h3>Telegram Clone</h3>
      <p>Select a chat to start messaging</p>
    </div>

    <div class="chat-view" id="chatView" style="display:none">
      <div class="main-header" id="mainHeader">
        <div class="main-header-left">
          <div class="back-btn" id="backBtn">←</div>
          <div class="avatar small" id="chatAvatar"></div>
          <div>
            <h2 id="chatName">Loading...</h2>
            <span class="status" id="chatStatus"></span>
          </div>
        </div>
        <div class="main-header-right">
          <span id="chatSearchBtn">🔍</span>
          <span id="chatMenuBtn">⋮</span>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="reply-preview" id="replyPreview" style="display:none">
        <div class="reply-info">
          <span class="reply-label" id="replyLabel">Replying</span>
          <span class="reply-text" id="replyText"></span>
        </div>
        <span class="reply-close" id="replyClose">✕</span>
      </div>

      <div class="input-bar">
        <span class="input-emoji" id="emojiBtn">😊</span>
        <div class="input-wrapper">
          <input type="text" id="messageInput" placeholder="Write a message..." autocomplete="off">
          <label class="attach-btn">
            📎
            <input type="file" id="fileInput" hidden multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.zip">
          </label>
        </div>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="authModal">
  <div class="modal-content">
    <div class="modal-icon">✉️</div>
    <h2>Telegram Clone</h2>
    <p>Sign in to start messaging</p>
    <input type="text" id="authUsername" placeholder="Username" autocomplete="off">
    <input type="password" id="authPassword" placeholder="Password">
    <div class="modal-error" id="authError"></div>
    <button id="authBtn" onclick="login()">Sign In</button>
    <span class="auth-switch" onclick="toggleAuth()">Don't have an account? Register</span>
  </div>
</div>

<div class="modal" id="newChatModal" style="display:none">
  <div class="modal-content small">
    <h3>New Chat</h3>
    <input type="text" id="newChatSearch" placeholder="Search users..." autocomplete="off">
    <div class="user-list" id="userList"></div>
  </div>
</div>

<div class="modal" id="newGroupModal" style="display:none">
  <div class="modal-content small">
    <h3>New Group</h3>
    <input type="text" id="groupName" placeholder="Group name" autocomplete="off">
    <input type="text" id="groupSearch" placeholder="Add members..." autocomplete="off">
    <div class="user-list" id="groupUserList"></div>
    <div class="selected-users" id="selectedUsers"></div>
    <button id="createGroupBtn" onclick="createGroup()">Create Group</button>
  </div>
</div>

<div class="modal" id="profileModal" style="display:none">
  <div class="modal-content small">
    <h3>My Profile</h3>
    <div class="profile-avatar" id="profileAvatar"></div>
    <input type="text" id="profileBio" placeholder="Bio" maxlength="128">
    <input type="text" id="profilePhone" placeholder="Phone">
    <button onclick="updateProfile()">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script src="{% static 'script.js' %}"></script>
</body>
</html>
